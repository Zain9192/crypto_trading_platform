services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crypto_trading}
      POSTGRES_USER: ${POSTGRES_USER:-crypto_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crypto_user} -d ${POSTGRES_DB:-crypto_trading}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-crypto_market}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./database/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
    environment: &backend-environment
      APP_NAME: ${APP_NAME:-AI Crypto Trading Platform}
      APP_ENV: ${APP_ENV:-development}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-600}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-20}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      POSTGRES_DB: ${POSTGRES_DB:-crypto_trading}
      POSTGRES_USER: ${POSTGRES_USER:-crypto_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MONGO_DB: ${MONGO_DB:-crypto_market}
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-1440}
      JWT_REFRESH_TOKEN_MINUTES: ${JWT_REFRESH_TOKEN_MINUTES:-10080}
      EMAIL_VERIFICATION_TOKEN_MINUTES: ${EMAIL_VERIFICATION_TOKEN_MINUTES:-1440}
      LOGIN_MAX_FAILED_ATTEMPTS: ${LOGIN_MAX_FAILED_ATTEMPTS:-5}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
      AUTH_DATA_ENCRYPTION_KEY: ${AUTH_DATA_ENCRYPTION_KEY:?AUTH_DATA_ENCRYPTION_KEY is required}
      EXCHANGE_ENCRYPTION_KEY: ${EXCHANGE_ENCRYPTION_KEY:-}
      NOTIFICATION_EMAIL_PROVIDER: ${NOTIFICATION_EMAIL_PROVIDER:-disabled}
      NOTIFICATION_EMAIL_FROM: ${NOTIFICATION_EMAIL_FROM:-}
      NOTIFICATION_SMTP_HOST: ${NOTIFICATION_SMTP_HOST:-}
      NOTIFICATION_SMTP_PORT: ${NOTIFICATION_SMTP_PORT:-587}
      NOTIFICATION_SMTP_USERNAME: ${NOTIFICATION_SMTP_USERNAME:-}
      NOTIFICATION_SMTP_PASSWORD: ${NOTIFICATION_SMTP_PASSWORD:-}
      NOTIFICATION_SENDGRID_KEY: ${NOTIFICATION_SENDGRID_KEY:-}
      TOTP_ISSUER: ${TOTP_ISSUER:-AI Crypto Trading Platform}
      COINGECKO_BASE_URL: ${COINGECKO_BASE_URL:-https://api.coingecko.com/api/v3}
      BINANCE_MARKET_BASE_URL: ${BINANCE_MARKET_BASE_URL:-https://api.binance.com}
      MARKET_DEFAULT_QUOTE_ASSET: ${MARKET_DEFAULT_QUOTE_ASSET:-USDT}
      PREDICTION_ARTIFACT_DIR: /app/model_artifacts
      MARKET_REFRESH_SECONDS: ${MARKET_REFRESH_SECONDS:-30}
      MARKET_HISTORY_REFRESH_SECONDS: ${MARKET_HISTORY_REFRESH_SECONDS:-900}
      MARKET_HISTORY_CANDLE_LIMIT: ${MARKET_HISTORY_CANDLE_LIMIT:-500}
      MARKET_INGESTION_REQUEST_SPACING_SECONDS: ${MARKET_INGESTION_REQUEST_SPACING_SECONDS:-0.25}
      MARKET_CACHE_TTL_SECONDS: ${MARKET_CACHE_TTL_SECONDS:-25}
      OHLCV_CACHE_TTL_SECONDS: ${OHLCV_CACHE_TTL_SECONDS:-60}
      MARKET_HTTP_TIMEOUT_SECONDS: ${MARKET_HTTP_TIMEOUT_SECONDS:-10}
    volumes:
      - model_artifacts:/app/model_artifacts:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_started

  market-ingestion:
    build:
      context: ./backend
    command: ["python", "-m", "app.market.workers.ingestion"]
    environment:
      <<: *backend-environment
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started

  trading-worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.trading.worker"]
    environment:
      <<: *backend-environment
      TF_NUM_INTRAOP_THREADS: 1
      TF_NUM_INTEROP_THREADS: 1
      OMP_NUM_THREADS: 1
    volumes:
      - model_artifacts:/app/model_artifacts:ro
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_started

  notification-worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.notifications.email_worker"]
    environment:
      <<: *backend-environment
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  prediction-trainer:
    profiles: ["training"]
    build:
      context: ./backend
    entrypoint: ["python", "-m", "app.prediction.train"]
    command: ["--help"]
    environment:
      <<: *backend-environment
    volumes:
      - model_artifacts:/app/model_artifacts
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  model_artifacts:
  postgres_data:
  mongo_data:
  redis_data:
