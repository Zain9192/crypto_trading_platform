name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prediction_test
          POSTGRES_PASSWORD: prediction_test
          POSTGRES_DB: prediction_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prediction_test -d prediction_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PREDICTION_TEST_DSN: postgresql://prediction_test:prediction_test@localhost:5432/prediction_test
      REDIS_TEST_URL: redis://localhost:6379/15
      TF_NUM_INTRAOP_THREADS: 1
      TF_NUM_INTEROP_THREADS: 1
      OMP_NUM_THREADS: 1
      APP_ENV: test
      JWT_SECRET_KEY: test-only-secret-key-that-is-at-least-32-characters-long
      AUTH_DATA_ENCRYPTION_KEY: 65ujGo4u-rd5tR5SJEB0mvwCv4DZIuk6S7jgpQ8xOEc=
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply PostgreSQL migrations
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          import psycopg
          with psycopg.connect(os.environ["PREDICTION_TEST_DSN"]) as connection:
              for migration in sorted(Path("../database/postgres").glob("*.sql")):
                  connection.execute(migration.read_text())
          PYTHON

      - name: Run backend tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm install

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prediction_test
          POSTGRES_PASSWORD: prediction_test
          POSTGRES_DB: prediction_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prediction_test -d prediction_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      APP_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USER: prediction_test
      POSTGRES_PASSWORD: prediction_test
      POSTGRES_DB: prediction_test
      REDIS_HOST: localhost
      JWT_SECRET_KEY: test-only-secret-key-that-is-at-least-32-characters-long
      AUTH_DATA_ENCRYPTION_KEY: 65ujGo4u-rd5tR5SJEB0mvwCv4DZIuk6S7jgpQ8xOEc=
      TF_NUM_INTRAOP_THREADS: '1'
      TF_NUM_INTEROP_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          npm --prefix frontend install
          (cd frontend && npx playwright install --with-deps chromium)
      - name: Apply PostgreSQL migrations
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          import psycopg
          with psycopg.connect('postgresql://prediction_test:prediction_test@localhost:5432/prediction_test') as connection:
              for migration in sorted(Path('database/postgres').glob('*.sql')):
                  connection.execute(migration.read_text())
          PYTHON
      - name: Run browser journey
        run: npm --prefix frontend run test:e2e
      - name: Measure 500 concurrent HTTP requests
        run: |
          (cd backend && python -m uvicorn qa.server:app --host 127.0.0.1 --port 8000 --no-proxy-headers) &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health >/dev/null; then break; fi
            sleep 1
          done
          python backend/qa/load.py
      - name: Save browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-traces
          path: frontend/test-results/

  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Java sources
        id: java
        shell: bash
        run: |
          if find . -type f -name '*.java' \
            -not -path './.git/*' \
            -not -path './frontend/node_modules/*' \
            -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Java sources found. Checkstyle is configured and will activate automatically if Java code is added."
          fi

      - name: Set up Java
        if: steps.java.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Checkstyle
        run: ./scripts/run-checkstyle.sh
