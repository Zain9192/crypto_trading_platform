name: Production uptime

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    if: vars.PRODUCTION_URL != ''
    steps:
      - name: Check public HTTPS endpoint
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          case "$PRODUCTION_URL" in https://*) ;; *) echo 'PRODUCTION_URL must use HTTPS' >&2; exit 1 ;; esac
          curl --fail --silent --show-error --location --proto '=https' --connect-timeout 5 --max-time 15 "${PRODUCTION_URL%/}/api/v1/health"
